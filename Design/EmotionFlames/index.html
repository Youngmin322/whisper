<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Whisper 감정 불꽃 캐릭터</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #faf7f1; color: #29252a; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; }
    main { max-width: 1040px; margin: auto; padding: 52px 28px 70px; }
    h1 { margin: 0 0 8px; font-size: 30px; letter-spacing: -.04em; }
    .intro { margin: 0 0 32px; color: #6d6764; line-height: 1.6; }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    article { min-height: 322px; padding: 22px 20px 20px; border: 1px solid #eee8df; border-radius: 22px; background: #fffdf9; text-align: center; }
    .art { height: 226px; display: flex; align-items: center; justify-content: center; }
    .art img { display: block; max-width: 226px; max-height: 226px; object-fit: contain; }
    h2 { margin: 2px 0 5px; font-size: 20px; }
    p { margin: 0; color: #706b68; font-size: 13px; line-height: 1.5; }
    @media (max-width: 700px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } main { padding: 32px 16px; } }
    @media (max-width: 440px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>마음의 불꽃들</h1>
    <p class="intro">대표 캐릭터의 둥근 실루엣과 두 겹의 불꽃을 이어받아, 마음마다 다른 자세와 표정을 주었습니다.</p>
    <div class="grid">
      <article><div class="art"><img src="Approved/joy.png" alt="기쁨 불꽃"></div><h2>기쁨</h2><p>따뜻하고 환하게 웃는 원래 캐릭터</p></article>
      <article><div class="art"><img src="Approved/anxiety.png" alt="승인된 불안 불꽃"></div><h2>불안</h2><p>휘어진 끝과 걱정스러운 표정</p></article>
      <article><div class="art"><img src="Approved/depression.png" alt="승인된 우울 불꽃"></div><h2>우울</h2><p>처진 끝과 무거운 눈꺼풀</p></article>
      <article><div class="art"><img src="Approved/anger.png" alt="승인된 분노 불꽃"></div><h2>분노</h2><p>치솟은 불꽃과 다문 입</p></article>
      <article><div class="art"><img src="Approved/sadness.png" alt="승인된 슬픔 불꽃"></div><h2>슬픔</h2><p>처진 불꽃과 눈물 한 방울</p></article>
      <article><div class="art"><img src="Approved/calm.png" alt="승인된 평온 불꽃"></div><h2>평온</h2><p>편안히 감은 눈과 작은 미소</p></article>
    </div>
  </main>
</body>
</html>
