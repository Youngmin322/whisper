name: iOS CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

# A newer run replaces an older run for the same pull request or branch.
concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    # This project targets iOS 26, so use the macOS 26 runner with Xcode 26.
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build and test
        run: bash Scripts/test-ios.sh
