name: Deployment tools CI

on:
  pull_request:
    paths: ["Services/slack-deploy/**", "Scripts/notify-slack*", "fastlane/**", ".github/workflows/*deploy*.yml"]
  push:
    branches: [dev, main]
    paths: ["Services/slack-deploy/**", "Scripts/notify-slack*", "fastlane/**", ".github/workflows/*deploy*.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Test Slack authentication and deployment dispatch
        run: node --test Services/slack-deploy/test/*.test.js Scripts/notify-slack.test.mjs
      - name: Test API authentication, signing profiles, and review selection
        run: ruby fastlane/deploy_config_test.rb
      - name: Validate Fastfile syntax
        run: ruby -c fastlane/Fastfile
